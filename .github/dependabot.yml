version: 2
updates:
  - package-ecosystem: pip
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies]
    # numpy and the two OpenCV distributions are held together on purpose; see
    # the comments in requirements.txt before accepting a bump.
    groups:
      opencv-numpy:
        patterns: ["numpy", "opencv-python", "opencv-contrib-python"]
      tensorflow:
        patterns: ["tensorflow", "tf-keras"]
  - package-ecosystem: pip
    directory: /updater
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, updater]
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ["*"]
