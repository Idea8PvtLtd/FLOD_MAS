name: Tests

# The inspection PC runs Windows and Python 3.12, and the updater installs whatever is on
# the deployed branch. This runs the test suite there before a commit is relied on.
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Run the tests
        run: python -m unittest discover -s tests -p "test_*.py"
