name: CI

# Gate for every change. The inspection PC runs Windows with Python 3.12 and the starter
# installs whatever is on the deployed branch, so the tests must pass on Windows before
# a commit is relied on. Linux runs the same tests for the Linux build.
on:
  push:
    branches: [main, dev, "release/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Dependency lock matches requirements.txt
        run: tools/ci/check_lock.sh
      - name: Model files match their checksums
        run: python3 tools/ci/check_models.py --tracked
      - name: Lint (errors only)
        run: uvx ruff@0.17.0 check .

  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          # Safe to cache: every package is installed with --require-hashes, so a
          # tampered cache entry fails the hash check. ci.yml publishes nothing.
          cache: pip # zizmor: ignore[cache-poisoning]
          cache-dependency-path: requirements.lock
      - name: Linux display and OpenGL libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libgl1 libegl1 libtcl8.6 libtk8.6
      - name: Install locked requirements
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Run the tests (Windows)
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Run the tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -p "test_*.py"
